<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book List</title>
    <meta name="description" content="A simple list of books with progress bars." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Book list</p>
        <h1>Simple reading progress.</h1>
      </header>

      <section class="composer" aria-label="Add a book">
        <form id="addBookForm" class="add-book-form">
          <label>
            <span>Book title</span>
            <input name="title" type="text" placeholder="The Hobbit" required />
          </label>
          <label>
            <span>Total pages</span>
            <input name="totalPages" type="number" min="1" step="1" placeholder="310" required />
          </label>
          <label>
            <span>Current pages</span>
            <input name="currentPages" type="number" min="0" step="1" placeholder="120" required />
          </label>
          <button type="submit">Add book</button>
        </form>
        <div class="data-actions">
          <button id="exportBooksButton" type="button">Export data</button>
          <button id="importBooksButton" type="button">Import data</button>
          <input id="importBooksInput" type="file" accept=".json,.txt,application/json,text/plain" hidden />
        </div>
      </section>

      <section class="library" aria-label="Book list">
        <div id="bookList" class="book-list"></div>
      </section>
    </main>

    <template id="bookCardTemplate">
      <article class="book-row">
        <h2 class="title"></h2>
        <div class="progress-wrap" aria-label="Book progress">
          <div class="progress-track">
            <div class="progress-bar"></div>
          </div>
          <span class="percent"></span>
          <button class="edit-book" type="button">Edit</button>
          <button class="remove-book" type="button" aria-label="Remove book">Remove</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
