name: Website issue to books PR

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-books-pr:
    if: startsWith(github.event.issue.title, '[website-update]')
    runs-on: ubuntu-latest

    steps:
      - name: Create branch, update books markdown, open PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const base = "master";

            const body = issue.body || "";
            const match = body.match(/<!-- BOOKS_JSON_START -->\s*```json\s*([\s\S]*?)```\s*<!-- BOOKS_JSON_END -->/i);
            if (!match) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: "Could not find books JSON markers in this issue."
              });
              return;
            }

            let parsed;
            try {
              parsed = JSON.parse(match[1]);
            } catch {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: "Could not parse JSON in this issue."
              });
              return;
            }

            if (!Array.isArray(parsed)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: "Books payload must be a JSON array."
              });
              return;
            }

            const books = parsed
              .map((book) => {
                const totalPages = Number(book?.totalPages);
                const currentPagesRaw = Number(book?.currentPages ?? 0);
                if (
                  typeof book?.title !== "string" ||
                  typeof book?.author !== "string" ||
                  !Number.isFinite(totalPages) ||
                  totalPages < 1
                ) {
                  return null;
                }

                const currentPages = Number.isFinite(currentPagesRaw)
                  ? Math.min(Math.max(currentPagesRaw, 0), totalPages)
                  : 0;

                return {
                  id: String(book?.id ?? `book-${Date.now()}`),
                  title: book.title,
                  author: book.author,
                  totalPages,
                  currentPages,
                };
              })
              .filter(Boolean);

            const branch = `website-update-issue-${issue.number}`;

            let branchExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
            } catch {
              branchExists = false;
            }

            if (!branchExists) {
              const baseRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${base}`
              });

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.data.object.sha
              });
            }

            const booksMarkdown = [
              "# Books Database",
              "",
              "This file is the shared Markdown database for books used by the site.",
              "",
              "Edit the JSON block below to update book information.",
              "",
              "```json",
              JSON.stringify(books, null, 2),
              "```",
              "",
            ].join("\n");

            const existingFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: "data/books.md",
              ref: branch
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "data/books.md",
              message: `Update books data from website issue #${issue.number}`,
              content: Buffer.from(booksMarkdown).toString("base64"),
              sha: existingFile.data.sha,
              branch
            });

            const existingPr = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base,
              per_page: 1
            });

            if (existingPr.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Updated existing PR: ${existingPr.data[0].html_url}`
              });
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `Website books update from issue #${issue.number}`,
              body: `Automated update from website issue #${issue.number}.\n\nCloses #${issue.number}`,
              head: branch,
              base
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `Created PR: ${pr.data.html_url}`
            });
