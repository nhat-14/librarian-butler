name: Website issue to library PR

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-library-pr:
    if: startsWith(github.event.issue.title, '[website-update]')
    runs-on: ubuntu-latest

    steps:
      - name: Create branch, update library markdown, open PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const base = "master";
            const compareUrl = `https://github.com/${owner}/${repo}/compare/${base}...website-update-issue-${issue.number}?expand=1`;

            async function commentOnIssue(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
            }

            const body = issue.body || "";
            const booksMatch = body.match(/<!-- BOOKS_JSON_START -->\s*```json\s*([\s\S]*?)```\s*<!-- BOOKS_JSON_END -->/i);
            if (!booksMatch) {
              await commentOnIssue("Could not find books JSON markers in this issue.");
              return;
            }

            const moviesMatch = body.match(/<!-- MOVIES_JSON_START -->\s*```json\s*([\s\S]*?)```\s*<!-- MOVIES_JSON_END -->/i);
            if (!moviesMatch) {
              await commentOnIssue("Could not find movies JSON markers in this issue.");
              return;
            }

            let parsedBooks;
            let parsedMovies;
            try {
              parsedBooks = JSON.parse(booksMatch[1]);
            } catch {
              await commentOnIssue("Could not parse books JSON in this issue.");
              return;
            }

            try {
              parsedMovies = JSON.parse(moviesMatch[1]);
            } catch {
              await commentOnIssue("Could not parse movies JSON in this issue.");
              return;
            }

            if (!Array.isArray(parsedBooks)) {
              await commentOnIssue("Books payload must be a JSON array.");
              return;
            }

            if (!Array.isArray(parsedMovies)) {
              await commentOnIssue("Movies payload must be a JSON array.");
              return;
            }

            const books = parsedBooks
              .map((book) => {
                const totalPages = Number(book?.totalPages);
                if (
                  typeof book?.title !== "string" ||
                  typeof book?.author !== "string" ||
                  !Number.isFinite(totalPages) ||
                  totalPages < 1
                ) {
                  return null;
                }

                let pagesRead = String(book?.pagesRead ?? "").trim();

                // Backward compatibility for older payloads that still send currentPages.
                if (!pagesRead) {
                  const currentPagesRaw = Number(book?.currentPages ?? 0);
                  if (Number.isFinite(currentPagesRaw) && currentPagesRaw > 0) {
                    const clampedPages = Math.min(Math.max(currentPagesRaw, 0), totalPages);
                    pagesRead = `1-${clampedPages}`;
                  }
                }

                return {
                  id: String(book?.id ?? `book-${Date.now()}`),
                  title: book.title,
                  author: book.author,
                  totalPages,
                  pagesRead,
                };
              })
              .filter(Boolean);

            const movies = parsedMovies
              .map((movie) => {
                if (typeof movie?.title !== "string") {
                  return null;
                }

                const normalizedStatus = String(movie?.status ?? "want-to-watch").trim();
                const status = normalizedStatus === "watched" ? "watched" : "want-to-watch";
                const yearNumber = movie?.year === null || movie?.year === undefined || movie?.year === ""
                  ? null
                  : Number(movie?.year);

                return {
                  id: String(movie?.id ?? `movie-${Date.now()}`),
                  title: movie.title,
                  year: Number.isFinite(yearNumber) ? yearNumber : null,
                  status,
                };
              })
              .filter(Boolean);

            const branch = `website-update-issue-${issue.number}`;

            let branchExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
            } catch {
              branchExists = false;
            }

            if (!branchExists) {
              const baseRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${base}`
              });

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.data.object.sha
              });
            }

            const booksMarkdown = [
              "# Books Database",
              "",
              "This file is the shared Markdown database for books used by the site.",
              "",
              "Edit the JSON block below to update book information.",
              "",
              "```json",
              JSON.stringify(books, null, 2),
              "```",
              "",
            ].join("\n");

            const moviesMarkdown = [
              "# Movies & Drama Database",
              "",
              "This file is the shared Markdown database for movies and dramas used by the site.",
              "",
              "Edit the JSON block below to update movie information.",
              "",
              "```json",
              JSON.stringify(movies, null, 2),
              "```",
              "",
            ].join("\n");

            const existingFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: "data/books.md",
              ref: branch
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "data/books.md",
              message: `Update books data from website issue #${issue.number}`,
              content: Buffer.from(booksMarkdown).toString("base64"),
              sha: existingFile.data.sha,
              branch
            });

            const existingMoviesFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: "data/movies.md",
              ref: branch
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "data/movies.md",
              message: `Update movies data from website issue #${issue.number}`,
              content: Buffer.from(moviesMarkdown).toString("base64"),
              sha: existingMoviesFile.data.sha,
              branch
            });

            const existingPr = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base,
              per_page: 1
            });

            if (existingPr.data.length > 0) {
              await commentOnIssue(`Updated existing PR: ${existingPr.data[0].html_url}`);
              return;
            }

            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: `Website library update from issue #${issue.number}`,
                body: `Automated update from website issue #${issue.number}.\n\nCloses #${issue.number}`,
                head: branch,
                base
              });

              await commentOnIssue(`Created PR: ${pr.data.html_url}`);
            } catch (error) {
              if (
                error?.status === 403 &&
                /not permitted to create or approve pull requests/i.test(error?.message || "")
              ) {
                await commentOnIssue(
                  `Updated \`${branch}\`, but GitHub Actions is not allowed to open pull requests in this repository. Open one manually here: ${compareUrl}`
                );
                return;
              }

              throw error;
            }
